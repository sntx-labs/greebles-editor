<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>greebles_001 Editor</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a08;
  overflow: hidden;
}

body {
  color: #fff;
}

#app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  width: 100%;
  height: 100%;
}

body.embed-mode #app {
  grid-template-columns: minmax(0, 1fr);
}

#stage {
  position: relative;
  min-width: 0;
  height: 100%;
  overflow: hidden;
  background: #0a0a08;
}

#canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#controls {
  height: 100%;
  min-width: 0;
}

#toast {
  transition: opacity 180ms ease;
}


/* ── SHPanel — Screenhouse control panel ─────────────────── */

:root {
  --sh-bg: rgba(8, 8, 8, 0.94);
  --sh-border: rgba(255, 255, 255, 0.06);
  --sh-text: rgba(255, 255, 255, 0.88);
  --sh-text-dim: rgba(255, 255, 255, 0.38);
  --sh-text-mid: rgba(255, 255, 255, 0.55);
  --sh-surface: rgba(255, 255, 255, 0.06);
  --sh-surface-hover: rgba(255, 255, 255, 0.1);
  --sh-accent: rgba(255, 255, 255, 0.7);
  --sh-radius: 4px;
  --sh-width: 320px;
  --sh-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* ── Panel drawer ──────────────────────────────────────── */

.sh-panel {
  position: relative;
  top: auto;
  right: auto;
  width: var(--sh-width);
  max-width: min(40vw, var(--sh-width));
  height: 100%;
  box-sizing: border-box;
  background: var(--sh-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-left: 1px solid var(--sh-border);
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  z-index: 1;
  transition: width 280ms cubic-bezier(.4,0,.2,1),
              opacity 200ms ease,
              min-width 280ms cubic-bezier(.4,0,.2,1);
  font-family: var(--sh-font);
  color: var(--sh-text);
  font-size: 12px;
  line-height: 1.4;
}

.sh-panel.collapsed {
  width: 0;
  min-width: 0;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
  border-left-width: 0;
}

.sh-panel-body {
  padding: 16px 14px 32px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.sh-panel-footer {
  padding: 0 18px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--sh-text-dim);
  font-size: 10px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}

.sh-panel-footer a {
  color: var(--sh-text);
  text-decoration: none;
  transition: color 140ms ease, opacity 140ms ease;
}

.sh-panel-footer a:hover {
  color: #fff;
}

.sh-panel-footer-sep {
  color: var(--sh-text-dim);
  opacity: 0.55;
}

/* ── Hint pill ─────────────────────────────────────────── */

.sh-panel-hint {
  position: fixed;
  right: 14px;
  bottom: 14px;
  padding: 5px 10px;
  font-family: var(--sh-font);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--sh-text-dim);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--sh-border);
  border-radius: 999px;
  pointer-events: none;
  z-index: 101;
  transition: opacity 600ms ease;
}
.sh-panel-hint.hidden { opacity: 0; }

/* ── Folders ───────────────────────────────────────────── */

.sh-folder {
  margin-bottom: 2px;
}

.sh-folder-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 2px;
  cursor: pointer;
  user-select: none;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: var(--sh-text-mid);
  transition: color 150ms ease;
}

.sh-folder-head:hover { color: var(--sh-text); }

.sh-arrow {
  font-size: 10px;
  transition: transform 200ms ease;
  display: inline-block;
}

.sh-folder.collapsed .sh-arrow { transform: rotate(-90deg); }

.sh-folder-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-left: 4px;
  overflow: hidden;
  max-height: 4000px;
  transition: max-height 300ms ease, opacity 200ms ease;
}

.sh-folder.collapsed > .sh-folder-body {
  max-height: 0;
  opacity: 0;
  pointer-events: none;
}

/* ── Shared control row ────────────────────────────────── */

.sh-ctrl {
  padding: 6px 4px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sh-ctrl-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.sh-label {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--sh-text-dim);
}

.sh-value {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--sh-text-mid);
  min-width: 36px;
  text-align: right;
}

/* ── Slider ────────────────────────────────────────────── */

.sh-slider input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 3px;
  background: var(--sh-surface);
  border-radius: 2px;
  cursor: pointer;
  outline: none;
}

.sh-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 10px;
  height: 10px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(255,255,255,0.25);
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease;
}

.sh-slider input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.25);
  box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

.sh-slider input[type="range"]::-moz-range-thumb {
  width: 10px;
  height: 10px;
  background: #fff;
  border: none;
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(255,255,255,0.25);
  cursor: pointer;
}

.sh-slider input[type="range"]::-moz-range-track {
  height: 3px;
  background: var(--sh-surface);
  border-radius: 2px;
}

/* ── Color swatch ──────────────────────────────────────── */

.sh-color {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}

.sh-color input[type="color"] {
  -webkit-appearance: none;
  appearance: none;
  width: 36px;
  height: 20px;
  padding: 0;
  border: 1px solid var(--sh-border);
  border-radius: var(--sh-radius);
  background: transparent;
  cursor: pointer;
}

.sh-color input[type="color"]::-webkit-color-swatch-wrapper { padding: 1px; }
.sh-color input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

/* ── Toggle switch ─────────────────────────────────────── */

.sh-toggle {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}

.sh-switch {
  position: relative;
  display: inline-block;
  width: 32px;
  height: 16px;
  cursor: pointer;
}

.sh-switch input {
  opacity: 0;
  width: 0;
  height: 0;
  position: absolute;
}

.sh-knob {
  position: absolute;
  inset: 0;
  background: var(--sh-surface);
  border-radius: 999px;
  transition: background 200ms ease;
}

.sh-knob::after {
  content: '';
  position: absolute;
  left: 2px;
  top: 2px;
  width: 12px;
  height: 12px;
  background: rgba(255,255,255,0.35);
  border-radius: 50%;
  transition: transform 200ms ease, background 200ms ease;
}

.sh-switch input:checked + .sh-knob {
  background: rgba(255,255,255,0.15);
}

.sh-switch input:checked + .sh-knob::after {
  transform: translateX(16px);
  background: #fff;
}

/* ── Button ────────────────────────────────────────────── */

.sh-btn {
  display: block;
  width: 100%;
  padding: 7px 12px;
  margin: 2px 0;
  font-family: var(--sh-font);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.6px;
  color: var(--sh-text);
  background: var(--sh-surface);
  border: 1px solid var(--sh-border);
  border-radius: var(--sh-radius);
  cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease;
}

.sh-btn:hover {
  background: var(--sh-surface-hover);
  border-color: rgba(255,255,255,0.12);
}

.sh-btn:active {
  background: rgba(255,255,255,0.14);
}

/* ── Select ────────────────────────────────────────────── */

.sh-select {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}

.sh-select select {
  padding: 4px 8px;
  font-family: var(--sh-font);
  font-size: 11px;
  color: var(--sh-text);
  background: var(--sh-surface);
  border: 1px solid var(--sh-border);
  border-radius: var(--sh-radius);
  outline: none;
  cursor: pointer;
  min-width: 90px;
  transition: border-color 150ms ease;
}

.sh-select select:hover { border-color: rgba(255,255,255,0.15); }

.sh-select select option {
  background: #111;
  color: var(--sh-text);
}

/* ── File ──────────────────────────────────────────────── */

.sh-file { padding: 4px; }

/* ── Scrollbar ─────────────────────────────────────────── */

.sh-panel::-webkit-scrollbar { width: 5px; }
.sh-panel::-webkit-scrollbar-track { background: transparent; }
.sh-panel::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
}
.sh-panel::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,0.2);
}

  </style>
</head>
<body>
  <div id="app">

  <script>
    window.__GREEBLES_MAIN_SOURCE__ = "// greebles_001\n// Customizable sci-fi greeble generator for embeddable website backgrounds\n\nconst stage = document.getElementById('stage');\nconst displayCanvas = document.getElementById('canvas');\nconst controls = document.getElementById('controls');\nconst DPR = window.devicePixelRatio || 1;\nconst searchParams = new URLSearchParams(window.location.search);\nconst isStaticCustomer = window.__GREEBLES_STATIC_CUSTOMER__ === true;\nconst isEmbedMode = window.__GREEBLES_EMBED__ === true || searchParams.get('embed') === '1';\nlet W, H;\nlet resizeFrame = 0;\nlet resizeTimer = 0;\n\n// ── Config ──────────────────────────────────────────────\nconst DEFAULT_CONFIG = {\n  bgColor: '#0a0a08',\n  panelBg: '#0e0e0b',\n  borderColor: '#2a2a1e',\n  accentColor: '#ff7b00',\n  accentDim: '#00ccff',\n  accentBright: '#ffae00',\n  glowColor: '#ffbf00',\n  textColor: '#887744',\n  glowIntensity: 2.0,\n  animationSpeed: 1.0,\n  greeblingDensity: 0.75,\n  panelSpacing: 5,\n  floatingDensity: 1,\n  colorPreset: 'Default',\n};\n\nconst config = { ...DEFAULT_CONFIG };\nconst exportSettings = {\n  iframeHeight: 720,\n};\n\nconst colorKeys = [\n  'bgColor',\n  'panelBg',\n  'borderColor',\n  'accentColor',\n  'accentDim',\n  'accentBright',\n  'glowColor',\n  'textColor',\n];\n\nconst exportKeys = [\n  'bgColor',\n  'panelBg',\n  'borderColor',\n  'accentColor',\n  'accentDim',\n  'accentBright',\n  'glowColor',\n  'textColor',\n  'glowIntensity',\n  'animationSpeed',\n  'greeblingDensity',\n  'panelSpacing',\n  'floatingDensity',\n  'colorPreset',\n];\n\nconst colorPresets = {\n  Default: {\n    bgColor: '#0a0a08',\n    panelBg: '#0e0e0b',\n    borderColor: '#2a2a1e',\n    accentColor: '#ff7b00',\n    accentDim: '#00ccff',\n    accentBright: '#ffae00',\n    glowColor: '#ffbf00',\n    textColor: '#887744',\n  },\n  'Ice Station': {\n    bgColor: '#05080a',\n    panelBg: '#09131b',\n    borderColor: '#183448',\n    accentColor: '#58d7ff',\n    accentDim: '#ff9a4d',\n    accentBright: '#d8fbff',\n    glowColor: '#9ae8ff',\n    textColor: '#6f9fb0',\n  },\n  'Reactor Core': {\n    bgColor: '#0a0605',\n    panelBg: '#1b0f0b',\n    borderColor: '#4a2416',\n    accentColor: '#ff5b2e',\n    accentDim: '#4ecbff',\n    accentBright: '#fff0a8',\n    glowColor: '#ffb347',\n    textColor: '#aa6f52',\n  },\n  'Bio Terminal': {\n    bgColor: '#040805',\n    panelBg: '#08140d',\n    borderColor: '#1a3c28',\n    accentColor: '#56ff87',\n    accentDim: '#c86cff',\n    accentBright: '#d9ffe6',\n    glowColor: '#87ffb7',\n    textColor: '#6ea47c',\n  },\n  'Ultraviolet': {\n    bgColor: '#06050a',\n    panelBg: '#120d1d',\n    borderColor: '#342258',\n    accentColor: '#b06cff',\n    accentDim: '#9cff57',\n    accentBright: '#ffd0ff',\n    glowColor: '#d296ff',\n    textColor: '#8d7bb0',\n  },\n  'Amber Monochrome': {\n    bgColor: '#080603',\n    panelBg: '#120c06',\n    borderColor: '#47311b',\n    accentColor: '#ff9c1a',\n    accentDim: '#53c8ff',\n    accentBright: '#ffe29a',\n    glowColor: '#ffc14d',\n    textColor: '#9d7743',\n  },\n};\n\nfunction readConfigFromUrl() {\n  const inlineConfig = window.__GREEBLES_CONFIG__;\n\n  if (inlineConfig && typeof inlineConfig === 'object') {\n    exportKeys.forEach((key) => {\n      if (Object.hasOwn(inlineConfig, key)) {\n        config[key] = inlineConfig[key];\n      }\n    });\n  }\n\n  const encoded = searchParams.get('config');\n\n  if (!encoded) return;\n\n  try {\n    const parsed = JSON.parse(atob(encoded));\n    if (parsed && typeof parsed === 'object') {\n      exportKeys.forEach((key) => {\n        if (Object.hasOwn(parsed, key)) {\n          config[key] = parsed[key];\n        }\n      });\n    }\n  } catch (error) {\n    console.warn('Unable to parse config from URL.', error);\n  }\n}\n\nfunction getSerializableConfig() {\n  return exportKeys.reduce((payload, key) => {\n    payload[key] = config[key];\n    return payload;\n  }, {});\n}\n\nfunction buildShareUrl({ embed = false } = {}) {\n  const url = new URL(window.location.href);\n  url.searchParams.set('config', btoa(JSON.stringify(getSerializableConfig())));\n  if (embed) {\n    url.searchParams.set('embed', '1');\n  } else {\n    url.searchParams.delete('embed');\n  }\n  return url.toString();\n}\n\nfunction escapeHtmlAttribute(value) {\n  return value\n    .replace(/&/g, '&amp;')\n    .replace(/\"/g, '&quot;')\n    .replace(/</g, '&lt;')\n    .replace(/>/g, '&gt;');\n}\n\nlet mainSourcePromise = null;\n\nasync function getMainSource() {\n  if (typeof window.__GREEBLES_MAIN_SOURCE__ === 'string' && window.__GREEBLES_MAIN_SOURCE__.length > 0) {\n    return window.__GREEBLES_MAIN_SOURCE__;\n  }\n\n  if (!mainSourcePromise) {\n    mainSourcePromise = Promise.resolve(window.__GREEBLES_MAIN_SOURCE__ || '');\n  }\n\n  return mainSourcePromise;\n}\n\nasync function buildStandaloneHtml() {\n  const mainSource = await getMainSource();\n\n  return `<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>greebles_001 Embed</title>\n  <style>\n    * { box-sizing: border-box; }\n    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: ${config.bgColor}; }\n    body.embed-mode { color: #fff; }\n    #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: ${config.bgColor}; }\n    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }\n  </style>\n</head>\n<body>\n  <div id=\"stage\">\n    <canvas id=\"canvas\"></canvas>\n  </div>\n  <script>\n    window.__GREEBLES_EMBED__ = true;\n    window.__GREEBLES_CONFIG__ = ${JSON.stringify(getSerializableConfig())};\n  <\/script>\n  <script type=\"module\">\n${mainSource}\n  <\/script>\n</body>\n</html>`;\n}\n\nasync function buildIframeSrcdocMarkup() {\n  const html = await buildStandaloneHtml();\n  const heightPx = `${Math.round(exportSettings.iframeHeight  3, w - pad * 2, 4, t + seed);\n  drawMicroText(x + 3, y + 8, t, seed);\n}\n\n// ── PANEL LAYOUT ────────────────────────────────────────\n// Fill the full viewport with a dense field of modular greeble panels\n\nfunction generatePanelLayout(revealOptions = {}) {\n  const panels = [];\n  const density = Math.max(0.3, config.greeblingDensity);\n  const densityScale = 1 / density;\n  const margin = Math.max(2, Math.round(config.panelSpacing * densityScale));\n  const revealStartAt = revealOptions.revealStartAt ?? 0;\n  const revealStepMs = revealOptions.revealStepMs ?? 0;\n  const revealDurationMs = revealOptions.revealDurationMs ?? 1;\n  const maxRevealTotalMs = revealOptions.maxRevealTotalMs ?? Infinity;\n  const revealOrder = [];\n\n  const panelTypes = [\n    [drawCircularGauge, drawCircularGaugeVariant],\n    [drawWaveform, drawWaveformVariant],\n    [drawBarChart, drawBarChartVariant],\n    [drawDotMatrix, drawDotMatrixVariant],\n    [drawKnobCluster],\n    [drawHBars, drawHBarsVariant],\n    [drawRadar],\n    [drawGridMesh, drawGridMeshVariant],\n    [drawDataScan],\n    [drawLEDRow],\n    [drawSliderBank],\n  ];\n\n  srand(123);\n\n  function choosePanelType() {\n    const family = panelTypes[Math.floor(rand() * panelTypes.length)];\n    return family.length > 1 && rand() > 0.48 ? family[1] : family[0];\n  }\n\n  // Fill regions without leaving sliver gaps at resize boundaries.\n  function fillRegion(rx, ry, rw, rh, panelSeed) {\n    let py = ry;\n    let localSeed = panelSeed;\n    const maxX = rx + rw;\n    const maxY = ry + rh;\n\n    while (py < maxY - 14) {\n      const remainingH = maxY - py;\n      let rowH = Math.round((22 + rand() * 42) * densityScale);\n      if (remainingH < rowH + margin + 16) rowH = remainingH;\n      rowH = Math.max(16, rowH);\n\n      let px = rx;\n      while (px < maxX - 14) {\n        const remainingW = maxX - px;\n        let pw = Math.round((30 + rand() * 70) * densityScale);\n        if (remainingW < pw + margin + 16) pw = remainingW;\n        pw = Math.max(16, pw);\n\n        if (pw > 15 && rowH > 15) {\n          const panelIndex = panels.length;\n          panels.push({\n            x: px,\n            y: py,\n            w: pw,\n            h: rowH,\n            type: choosePanelType(),\n            seed: localSeed,\n            revealAt: revealStartAt,\n            revealDuration: revealDurationMs,\n          });\n          revealOrder.push(panelIndex);\n          localSeed += 7;\n        }\n\n        if (remainingW <= pw) break;\n        px += pw + margin;\n      }\n\n      if (remainingH <= rowH) break;\n      py += rowH + margin;\n    }\n  }\n\n  fillRegion(margin, margin, W - margin * 2, H - margin * 2, 100);\n\n  for (let i = revealOrder.length - 1; i > 0; i--) {\n    const j = Math.floor(rand() * (i + 1));\n    const temp = revealOrder[i];\n    revealOrder[i] = revealOrder[j];\n    revealOrder[j] = temp;\n  }\n\n  const maxStaggerSpan = Math.max(0, maxRevealTotalMs - revealDurationMs);\n  const effectiveRevealStepMs = revealOrder.length > 1\n    ? Math.min(revealStepMs, maxStaggerSpan / (revealOrder.length - 1))\n    : 0;\n\n  revealOrder.forEach((panelIndex, orderIndex) => {\n    panels[panelIndex].revealAt = revealStartAt + orderIndex * effectiveRevealStepMs;\n  });\n\n  return panels;\n}\n\n// ── EDGE GREEBLINGS ─────────────────────────────────────\nfunction drawEdgeGreeblings(t) {\n  // Top edge ticks\n  drawTicksH(0, 1, W, 4 / config.greeblingDensity, t);\n  // Bottom edge ticks\n  drawTicksH(0, H - 3, W, 4 / config.greeblingDensity, t + 100);\n  // Left edge ticks\n  drawTicksV(1, 0, H, 4 / config.greeblingDensity, t + 200);\n  // Right edge ticks\n  drawTicksV(W - 3, 0, H, 4 / config.greeblingDensity, t + 300);\n\n  // Corner ornaments\n  const corners = [[8, 8], [W - 20, 8], [8, H - 20], [W - 20, H - 20]];\n  corners.forEach(([cx, cy], ci) => {\n    ctx.strokeStyle = rgba(config.borderColor, 0.5);\n    ctx.lineWidth = 1;\n    const dx = ci % 2 === 0 ? 1 : -1;\n    const dy = ci < 2 ? 1 : -1;\n    ctx.beginPath();\n    ctx.moveTo(cx + dx * 12, cy);\n    ctx.lineTo(cx, cy);\n    ctx.lineTo(cx, cy + dy * 12);\n    ctx.stroke();\n\n    ctx.beginPath();\n    ctx.moveTo(cx + dx * 6, cy + dy * 2);\n    ctx.lineTo(cx + dx * 6, cy + dy * 8);\n    ctx.moveTo(cx + dx * 2, cy + dy * 6);\n    ctx.lineTo(cx + dx * 8, cy + dy * 6);\n    ctx.stroke();\n\n    for (let i = 0; i < 3; i++) {\n      ctx.fillStyle = rgba(config.accentDim, 0.3 + 0.2 * Math.sin(t * 0.002 + ci + i));\n      ctx.fillRect(cx + dx * (3 + i * 4), cy + dy * 3, 2, 2);\n    }\n\n    const pulse = 0.2 + 0.25 * Math.max(0, Math.sin(t * 0.003 + ci * 0.8));\n    ctx.strokeStyle = rgba(config.accentBright, pulse);\n    ctx.strokeRect(cx + dx * 9 - 2, cy + dy * 9 - 2, 4, 4);\n  });\n\n  // Scattered micro-text along edges\n  for (let i = 0; i < 20; i++) {\n    srand(500 + i);\n    const ex = rand() * W;\n    const ey = rand() < 0.5 ? 6 + rand() * 15 : H - 8 - rand() * 15;\n    drawMicroText(ex, ey, t, 500 + i);\n  }\n  for (let i = 0; i < 14; i++) {\n    srand(600 + i);\n    const ex = rand() < 0.5 ? 5 + rand() * 10 : W - 35 - rand() * 10;\n    const ey = rand() * H;\n    drawMicroText(ex, ey, t, 600 + i);\n  }\n}\n\n// ── SCANLINES ───────────────────────────────────────────\nfunction drawScanlines() {\n  if (config.scanlineOpacity <= 0) return;\n  ctx.fillStyle = `rgba(0,0,0,${config.scanlineOpacity})`;\n  for (let y = 0; y < H; y += 2) {\n    ctx.fillRect(0, y, W, 1);\n  }\n}\n\nfunction drawCentralAperture(t) {\n  const cx = W * 0.5;\n  const cy = H * 0.5;\n  const sphereR = Math.min(W, H) * 0.29;\n  const bezelPad = 8;\n  const x = Math.floor(cx - sphereR - bezelPad);\n  const y = Math.floor(cy - sphereR - bezelPad);\n  const w = Math.ceil(sphereR * 2 + bezelPad * 2);\n  const h = Math.ceil(sphereR * 2 + bezelPad * 2);\n\n  ctx.fillStyle = config.bgColor;\n  ctx.fillRect(x, y, w, h);\n\n  ctx.strokeStyle = rgba(config.borderColor, 0.5);\n  ctx.lineWidth = 1;\n  ctx.strokeRect(x, y, w, h);\n\n  ctx.strokeStyle = rgba(config.borderColor, 0.22);\n  ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);\n\n  ctx.strokeStyle = rgba(config.accentDim, 0.16);\n  ctx.beginPath();\n  ctx.moveTo(x + 20, y + 1);\n  ctx.lineTo(x + w - 20, y + 1);\n  ctx.moveTo(x + 20, y + h - 2);\n  ctx.lineTo(x + w - 20, y + h - 2);\n  ctx.moveTo(x + 1, y + 20);\n  ctx.lineTo(x + 1, y + h - 20);\n  ctx.moveTo(x + w - 2, y + 20);\n  ctx.lineTo(x + w - 2, y + h - 20);\n  ctx.stroke();\n\n  const corners = [\n    [x + 5, y + 5, 1, 1],\n    [x + w - 5, y + 5, -1, 1],\n    [x + 5, y + h - 5, 1, -1],\n    [x + w - 5, y + h - 5, -1, -1],\n  ];\n\n  corners.forEach(([cx0, cy0, dx, dy], i) => {\n    ctx.strokeStyle = rgba(config.borderColor, 0.55);\n    ctx.beginPath();\n    ctx.moveTo(cx0, cy0 + dy * 10);\n    ctx.lineTo(cx0, cy0);\n    ctx.lineTo(cx0 + dx * 10, cy0);\n    ctx.stroke();\n\n    ctx.fillStyle = rgba(config.accentBright, 0.15 + 0.08 * Math.sin(t * 0.003 + i));\n    ctx.fillRect(cx0 + dx * 6 - 1, cy0 + dy * 6 - 1, 3, 3);\n  });\n\n  drawTicksH(x + 24, y + 3, w - 48, 5, t + 50);\n  drawTicksH(x + 24, y + h - 6, w - 48, 5, t + 150);\n  drawTicksV(x + 3, y + 24, h - 48, 5, t + 250);\n  drawTicksV(x + w - 6, y + 24, h - 48, 5, t + 350);\n}\n\n// ── CONNECTOR LINES ─────────────────────────────────────\nfunction drawConnectors(t) {\n  const cx = W * 0.5;\n  const cy = H * 0.5;\n  const r = Math.min(W, H) * 0.29;\n\n  const endpoints = [\n    { a: -0.5, d: 1.05 }, { a: -1.2, d: 1.1 }, { a: -1.8, d: 1.05 },\n    { a: 0.3, d: 1.08 }, { a: 1.0, d: 1.1 }, { a: 2.0, d: 1.05 },\n    { a: 2.5, d: 1.08 }, { a: -2.5, d: 1.12 },\n  ];\n\n  endpoints.forEach((ep, i) => {\n    const x1 = cx + Math.cos(ep.a) * r * 0.95;\n    const y1 = cy + Math.sin(ep.a) * r * 0.95;\n    const x2 = cx + Math.cos(ep.a) * r * ep.d * 1.3;\n    const y2 = cy + Math.sin(ep.a) * r * ep.d * 1.3;\n\n    ctx.strokeStyle = rgba(config.borderColor, 0.15 + 0.08 * Math.sin(t * 0.001 + i));\n    ctx.lineWidth = 0.5;\n    ctx.setLineDash([2, 4]);\n    ctx.beginPath();\n    ctx.moveTo(x1, y1);\n    ctx.lineTo(x2, y2);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    // Junction dot\n    ctx.fillStyle = rgba(config.accentDim, 0.4);\n    ctx.fillRect(x2 - 1, y2 - 1, 2, 2);\n  });\n}\n\n// ── FLOATING GREEBLINGS (between panels) ────────────────\nfunction drawFloatingGreeblings(t) {\n  if (config.floatingDensity <= 0) return;\n\n  const density = Math.floor(26 * config.greeblingDensity * config.floatingDensity);\n  const alphaScale = 0.3 + config.floatingDensity * 0.9;\n  const brightScale = 0.25 + config.floatingDensity * 0.75;\n\n  srand(999);\n  for (let i = 0; i < density; i++) {\n    const fx = rand() * W;\n    const fy = rand() * H;\n    const type = Math.floor(rand() * 8);\n    const phase = rand() * Math.PI * 2;\n    const speed = rand() * 0.003 + 0.001;\n    const alpha = (0.1 + 0.15 * Math.sin(t * speed + phase)) * alphaScale;\n\n    ctx.fillStyle = rgba(config.accentDim, alpha);\n\n    switch (type) {\n      case 0: // single dot\n        ctx.fillRect(fx, fy, 1, 1);\n        break;\n      case 1: // cross\n        ctx.fillRect(fx - 1, fy, 3, 1);\n        ctx.fillRect(fx, fy - 1, 1, 3);\n        break;\n      case 2: // L shape\n        ctx.fillRect(fx, fy, 3, 1);\n        ctx.fillRect(fx, fy, 1, 3);\n        break;\n      case 3: // dash pair\n        ctx.fillRect(fx, fy, 2, 1);\n        ctx.fillRect(fx + 4, fy, 2, 1);\n        break;\n      case 4: // corner bracket\n        ctx.fillRect(fx, fy, 4, 1);\n        ctx.fillRect(fx, fy, 1, 4);\n        ctx.fillRect(fx + 6, fy, 1, 4);\n        ctx.fillRect(fx, fy + 3, 4, 1);\n        break;\n      case 5: { // spinner cell\n        const ang = t * speed + phase;\n        ctx.fillRect(fx - 1, fy - 1, 3, 3);\n        ctx.fillRect(fx + Math.cos(ang) * 4, fy + Math.sin(ang) * 4, 2, 2);\n        break;\n      }\n      case 6: { // bus bracket\n        const pulse = (0.12 + 0.15 * Math.sin(t * speed * 1.3 + phase)) * brightScale;\n        ctx.fillStyle = rgba(config.accentColor, pulse);\n        ctx.fillRect(fx, fy, 8, 1);\n        ctx.fillRect(fx, fy + 4, 8, 1);\n        ctx.fillRect(fx, fy + 1, 1, 3);\n        ctx.fillRect(fx + 7, fy + 1, 1, 3);\n        break;\n      }\n      case 7: { // pulse ladder\n        for (let j = 0; j < 4; j++) {\n          const on = Math.sin(t * speed * 2 + phase - j * 0.5) > 0;\n          ctx.fillStyle = rgba(on ? config.accentBright : config.accentDim, (on ? 0.28 : 0.1) * alphaScale);\n          ctx.fillRect(fx + j * 3, fy + (j % 2), 2, 1);\n        }\n        break;\n      }\n    }\n  }\n\n  // Blinking LED clusters\n  srand(888);\n  const clusterCount = Math.floor(4 + config.floatingDensity * 28);\n  for (let i = 0; i < clusterCount; i++) {\n    const bx = rand() * W;\n    const by = rand() * H;\n    const numPips = 3 + Math.floor(rand() * 5);\n    for (let j = 0; j < numPips; j++) {\n      const on = Math.sin(t * 0.005 + j * 1.2 + i * 0.7) > 0.2;\n      ctx.fillStyle = rgba(config.accentBright, (on ? 0.4 : 0.05) * brightScale);\n      ctx.fillRect(bx + j * 4, by, 2, 2);\n    }\n  }\n\n  drawMorphRuneScatter(t);\n}\n\n// ── MAIN LOOP ───────────────────────────────────────────\nfunction animate() {\n  if (!hasValidViewportSize()) {\n    resize();\n\n    if (!hasValidViewportSize()) {\n      requestAnimationFrame(animate);\n      return;\n    }\n  }\n\n  const t = performance.now();\n\n  ctx.save();\n  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);\n\n  // Background\n  ctx.fillStyle = config.bgColor;\n  ctx.fillRect(0, 0, W, H);\n\n  // Panels\n  panelLayout.forEach(p => {\n    const revealDuration = p.revealDuration || 1;\n    const revealProgress = Math.max(0, Math.min(1, (t - (p.revealAt || 0)) / revealDuration));\n\n    if (revealProgress <= 0) return;\n\n    const easedReveal = 1 - Math.pow(1 - revealProgress, 3);\n    ctx.save();\n    ctx.globalAlpha *= easedReveal;\n    ctx.translate(0, (1 - easedReveal) * 8);\n    p.type(p.x, p.y, p.w, p.h, t, p.seed);\n   <script>
/**
 * SHPanel — Screenhouse zero-dependency control panel.
 * Drop-in replacement for Tweakpane / lil-gui.
 *
 * Usage:
 *   const panel = new SHPanel(containerEl);
 *   const f = panel.folder('Particles');
 *   f.slider(params, 'count', { min: 0, max: 5000, step: 1 })
 *    .on('change', e => rebuild());
 *   f.color(params, 'tint').on('change', e => mat.color.set(e.value));
 *   f.toggle(params, 'enabled');
 *   f.button('Reset', () => reset());
 *   f.select(params, 'mode', { options: ['push','pull'] });
 *   f.file({ accept: 'image/*' }).on('change', e => load(e.file));
 */
(function () {
  'use strict';

  const STORAGE_KEY = 'sh-panel-collapsed';

  function label(prop, opts) {
    if (opts && opts.label) return opts.label;
    return prop
      .replace(/([A-Z])/g, ' $1')
      .replace(/[_-]/g, ' ')
      .trim();
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function precision(step) {
    if (!step || step >= 1) return 0;
    const s = String(step);
    const dot = s.indexOf('.');
    return dot < 0 ? 0 : s.length - dot - 1;
  }

  function fmt(val, step) {
    const p = precision(step);
    return Number(val).toFixed(p);
  }

  class Emitter {
    constructor() { this._handlers = {}; }
    on(evt, fn) { (this._handlers[evt] || (this._handlers[evt] = [])).push(fn); return this; }
    _emit(evt, data) { (this._handlers[evt] || []).forEach(fn => fn(data)); }
  }

  // ── Controls ──────────────────────────────────────────────

  class SHSlider extends Emitter {
    constructor(obj, prop, opts, parentEl) {
      super();
      const o = Object.assign({ min: 0, max: 100, step: 1 }, opts);
      this._obj = obj; this._prop = prop; this._opts = o;

      const row = document.createElement('div');
      row.className = 'sh-ctrl sh-slider';

      const head = document.createElement('div');
      head.className = 'sh-ctrl-head';

      const lbl = document.createElement('span');
      lbl.className = 'sh-label';
      lbl.textContent = label(prop, opts);

      const val = document.createElement('span');
      val.className = 'sh-value';
      val.textContent = fmt(obj[prop], o.step);
      this._valEl = val;

      head.append(lbl, val);

      const range = document.createElement('input');
      range.type = 'range';
      range.min = o.min; range.max = o.max; range.step = o.step;
      range.value = obj[prop];
      this._input = range;

      range.addEventListener('input', () => {
        const v = parseFloat(range.value);
        obj[prop] = v;
        val.textContent = fmt(v, o.step);
        this._emit('change', { value: v });
      });

      row.append(head, range);
      parentEl.appendChild(row);
    }
    setValue(v) {
      v = clamp(v, this._opts.min, this._opts.max);
      this._obj[this._prop] = v;
      this._input.value = v;
      this._valEl.textContent = fmt(v, this._opts.step);
    }
  }

  class SHColor extends Emitter {
    constructor(obj, prop, opts, parentEl) {
      super();
      this._obj = obj; this._prop = prop;

      const row = document.createElement('div');
      row.className = 'sh-ctrl sh-color';

      const lbl = document.createElement('span');
      lbl.className = 'sh-label';
      lbl.textContent = label(prop, opts);

      const swatch = document.createElement('input');
      swatch.type = 'color';
      swatch.value = obj[prop];
      this._input = swatch;

      swatch.addEventListener('input', () => {
        obj[prop] = swatch.value;
        this._emit('change', { value: swatch.value });
      });

      row.append(lbl, swatch);
      parentEl.appendChild(row);
    }
    setValue(v) {
      this._obj[this._prop] = v;
      this._input.value = v;
    }
  }

  class SHToggle extends Emitter {
    constructor(obj, prop, opts, parentEl) {
      super();
      this._obj = obj; this._prop = prop;

      const row = document.createElement('div');
      row.className = 'sh-ctrl sh-toggle';

      const lbl = document.createElement('span');
      lbl.className = 'sh-label';
      lbl.textContent = label(prop, opts);

      const track = document.createElement('label');
      track.className = 'sh-switch';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!obj[prop];
      this._input = cb;

      const knob = document.createElement('span');
      knob.className = 'sh-knob';

      track.append(cb, knob);

      cb.addEventListener('change', () => {
        obj[prop] = cb.checked;
        this._emit('change', { value: cb.checked });
      });

      row.append(lbl, track);
      parentEl.appendChild(row);
    }
    setValue(v) {
      this._obj[this._prop] = !!v;
      this._input.checked = !!v;
    }
  }

  class SHButton extends Emitter {
    constructor(titleText, fn, parentEl) {
      super();
      const btn = document.createElement('button');
      btn.className = 'sh-btn';
      btn.textContent = titleText;
      btn.addEventListener('click', () => {
        if (fn) fn();
        this._emit('click', {});
      });
      parentEl.appendChild(btn);
    }
  }

  class SHSelect extends Emitter {
    constructor(obj, prop, opts, parentEl) {
      super();
      this._obj = obj; this._prop = prop;
      const o = opts || {};

      const row = document.createElement('div');
      row.className = 'sh-ctrl sh-select';

      const lbl = document.createElement('span');
      lbl.className = 'sh-label';
      lbl.textContent = label(prop, o);

      const sel = document.createElement('select');
      this._input = sel;

      const options = o.options || [];
      if (Array.isArray(options)) {
        options.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v; opt.textContent = v;
          if (v === obj[prop]) opt.selected = true;
          sel.appendChild(opt);
        });
      } else {
        Object.keys(options).forEach(k => {
          const opt = document.createElement('option');
          opt.value = options[k]; opt.textContent = k;
          if (options[k] === obj[prop]) opt.selected = true;
          sel.appendChild(opt);
        });
      }

      sel.addEventListener('change', () => {
        obj[prop] = sel.value;
        this._emit('change', { value: sel.value });
      });

      row.append(lbl, sel);
      parentEl.appendChild(row);
    }
    setValue(v) {
      this._obj[this._prop] = v;
      this._input.value = v;
    }
  }

  class SHFile extends Emitter {
    constructor(opts, parentEl) {
      super();
      const o = opts || {};

      const row = document.createElement('div');
      row.className = 'sh-ctrl sh-file';

      const btn = document.createElement('button');
      btn.className = 'sh-btn';
      btn.textContent = o.label || 'Choose File';

      const input = document.createElement('input');
      input.type = 'file';
      input.style.display = 'none';
      if (o.accept) input.accept = o.accept;

      btn.addEventListener('click', () => input.click());
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (file) this._emit('change', { file, value: file });
      });

      row.append(btn, input);
      parentEl.appendChild(row);
    }
  }

  // ── Folder ────────────────────────────────────────────────

  class SHFolder {
    constructor(titleText, parentEl, opts) {
      const o = Object.assign({ expanded: true }, opts);

      this.el = document.createElement('div');
      this.el.className = 'sh-folder' + (o.expanded ? '' : ' collapsed');

      const header = document.createElement('div');
      header.className = 'sh-folder-head';

      const arrow = document.createElement('span');
      arrow.className = 'sh-arrow';
      arrow.textContent = '\u25BE';

      const t = document.createElement('span');
      t.textContent = titleText;

      header.append(arrow, t);
      header.addEventListener('click', () => {
        this.el.classList.toggle('collapsed');
      });

      this._body = document.createElement('div');
      this._body.className = 'sh-folder-body';

      this.el.append(header, this._body);
      parentEl.appendChild(this.el);
    }

    slider(obj, prop, opts)  { return new SHSlider(obj, prop, opts, this._body); }
    color(obj, prop, opts)   { return new SHColor(obj, prop, opts, this._body); }
    toggle(obj, prop, opts)  { return new SHToggle(obj, prop, opts, this._body); }
    button(title, fn)        { return new SHButton(title, fn, this._body); }
    select(obj, prop, opts)  { return new SHSelect(obj, prop, opts, this._body); }
    file(opts)               { return new SHFile(opts, this._body); }
    folder(title, opts)      { return new SHFolder(title, this._body, opts); }
  }

  // ── Panel ─────────────────────────────────────────────────

  class SHPanel {
    constructor(container) {
      this._container = container;
      if (!container.classList.contains('sh-panel')) {
        container.classList.add('sh-panel');
      }

      this._body = document.createElement('div');
      this._body.className = 'sh-panel-body';
      container.appendChild(this._body);

      this._footer = document.createElement('div');
      this._footer.className = 'sh-panel-footer';
      this._footer.innerHTML = [
        '<span>by <a href="https://x.com/taylor_sntx" target="_blank" rel="noreferrer">Taylor</a></span>',
        '<span class="sh-panel-footer-sep">/</span>',
        '<a href="https://sntx.co/" target="_blank" rel="noreferrer">Syntax</a>',
      ].join('');
      container.appendChild(this._footer);

      this._setupToggle();
      this._setupHint();
    }

    _setupToggle() {
      let collapsed = sessionStorage.getItem(STORAGE_KEY) === 'true';
      if (collapsed) this._container.classList.add('collapsed');

      const toggle = () => {
        collapsed = !collapsed;
        sessionStorage.setItem(STORAGE_KEY, String(collapsed));
        this._container.classList.toggle('collapsed', collapsed);
        window.dispatchEvent(new Event('resize'));
        window.dispatchEvent(new CustomEvent('sh-panel-toggle', { detail: { collapsed } }));
      };

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Backquote') {
          e.preventDefault();
          toggle();
        }
      });
    }

    _setupHint() {
      let hint = document.querySelector('.sh-panel-hint');
      if (!hint) {
        hint = document.createElement('div');
        hint.className = 'sh-panel-hint';
        hint.setAttribute('aria-hidden', 'true');
        hint.textContent = '~ toggle panel';
        document.body.appendChild(hint);
      }
      setTimeout(() => hint.classList.add('hidden'), 3000);
    }

    folder(title, opts)      { return new SHFolder(title, this._body, opts); }
    slider(obj, prop, opts)  { return new SHSlider(obj, prop, opts, this._body); }
    color(obj, prop, opts)   { return new SHColor(obj, prop, opts, this._body); }
    toggle(obj, prop, opts)  { return new SHToggle(obj, prop, opts, this._body); }
    button(title, fn)        { return new SHButton(title, fn, this._body); }
    select(obj, prop, opts)  { return new SHSelect(obj, prop, opts, this._body); }
    file(opts)               { return new SHFile(opts, this._body); }
  }

  window.SHPanel = SHPanel;
})();

function resize() {
  const controlsWidth = !isEmbedMode && controls ? controls.clientWidth : 0;
  const nextWidth = stage.clientWidth || (window.innerWidth - controlsWidth);
  const nextHeight = stage.clientHeight || window.innerHeight;

  if (!nextWidth || !nextHeight) return;

function scheduleResize() {

    resizeFrame = 0;
  }
